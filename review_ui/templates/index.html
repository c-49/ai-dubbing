<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dub Review</title>
<style>
  html { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 1.5rem; background: #1a1b1e; color: #e4e4e7; }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  .sub { color: #9a9ca3; margin-bottom: 1rem; }
  .toolbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  button { cursor: pointer; border: 1px solid #3a3c42; background: #232428; color: #e4e4e7; border-radius: 6px; padding: 0.4rem 0.8rem; }
  button:hover { background: #2a2c31; }
  button:disabled { opacity: 0.5; cursor: default; }
  #remixStatus { font-size: 0.9rem; color: #9a9ca3; }

  select, textarea { background: #1a1b1e; color: #e4e4e7; border: 1px solid #3a3c42; border-radius: 4px; }

  .speakers { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .speaker-card { background: #232428; border: 1px solid #3a3c42; border-radius: 8px; padding: 0.75rem 1rem; min-width: 220px; }
  .speaker-card h3 { margin: 0 0 0.25rem; font-size: 1rem; }
  .speaker-card .meta { font-size: 0.8rem; color: #9a9ca3; margin-bottom: 0.5rem; }
  .speaker-card select { width: 100%; margin-bottom: 0.5rem; }
  .sample-btn { font-size: 0.75rem; padding: 0.2rem 0.5rem; margin-right: 0.25rem; margin-bottom: 0.25rem; }

  table { border-collapse: collapse; width: 100%; background: #232428; }
  th, td { border-bottom: 1px solid #333539; padding: 0.5rem; text-align: left; vertical-align: top; font-size: 0.9rem; }
  th { background: #2a2c31; color: #e4e4e7; position: sticky; top: var(--table-sticky-top, 0px); z-index: 1; }
  tr.flagged { background: #3a331a; }
  td.korean { color: #b5b7bd; max-width: 220px; }
  td.english textarea { width: 100%; min-height: 2.4em; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; }
  td.time { white-space: nowrap; font-size: 0.8rem; }
  .time-btn { background: none; border: none; padding: 0; color: #7cb0e8; cursor: pointer;
              font-size: 0.8rem; text-decoration: underline; font-family: inherit; }
  .time-btn:hover { color: #a8cdf0; }

  .sticky-video { position: sticky; top: 0; z-index: 5; background: #1a1b1e;
                  padding-top: 0.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid #3a3c42; }
  .video-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .video-col { flex: 1 1 320px; }
  .video-col .video-label { font-size: 0.8rem; color: #9a9ca3; margin-bottom: 0.25rem; }
  .video-col video { width: 100%; max-height: 32vh; object-fit: contain; border-radius: 8px; background: #000; display: block; }
  .preview-toggle { font-size: 0.85rem; color: #9a9ca3; }
  .play-btn { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
  .saved-ok { color: #7fd68f; font-size: 0.75rem; }
  .row-voice { font-size: 0.8rem; width: 100%; }
  input[type=checkbox] { transform: scale(1.2); }
  .back { font-size: 0.85rem; color: #9a9ca3; text-decoration: none; }
  .back:hover { text-decoration: underline; }

  .status-banner { background: #232428; border: 1px solid #3a3c42; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .status-banner .status-line { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
  .status-pill { font-size: 0.8rem; padding: 0.15rem 0.6rem; border-radius: 10px; display: inline-block; }
  .status-pill.pending { background: #3a331a; color: #e0c070; }
  .status-pill.queued, .status-pill.running { background: #1c2b40; color: #8fb8e8; }
  .status-pill.failed { background: #3a2020; color: #e58080; }
  .status-banner .error-msg { color: #e58080; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .log-tail { background: #0f1012; color: #c9cbd1; font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem;
              padding: 0.6rem 0.75rem; border-radius: 6px; max-height: 220px; overflow-y: auto; white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>

<a class="back" href="/show/{{ show }}">&larr; {{ show }}</a>
<h1 id="title">Dub Review</h1>
<div class="sub" id="subtitle"></div>

<div class="status-banner" id="statusBanner" style="display:none">
  <div class="status-line">
    <span class="status-pill" id="statusPill"></span>
    <span id="statusText"></span>
  </div>
  <div class="error-msg" id="statusError" style="display:none"></div>
  <pre class="log-tail" id="logTail" style="display:none"></pre>
</div>

<div id="editor" style="display:none">
  <div class="sticky-video" id="stickyVideo">
    <div class="video-row">
      <div class="video-col">
        <div class="video-label">Source</div>
        <video id="sourceVideo" controls></video>
      </div>
      <div class="video-col">
        <div class="video-label">Dub</div>
        <video id="dubVideo" controls></video>
      </div>
    </div>
    <div class="preview-toggle">
      Clicking a timestamp plays:
      <label><input type="radio" name="previewSource" value="source"> Original</label>
      <label><input type="radio" name="previewSource" value="dub" checked> Dub</label>
    </div>
  </div>

  <div class="toolbar">
    <button id="remixBtn">Re-run mix</button>
    <span id="remixStatus"></span>
    <label><input type="checkbox" id="filterFlagged"> Show only flagged (needs review)</label>
  </div>

  <div class="speakers" id="speakers"></div>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Time</th><th>Korean</th><th>English</th><th>Speaker / Voice</th><th>Play</th><th>Flag</th>
      </tr>
    </thead>
    <tbody id="segmentRows"></tbody>
  </table>
</div>

<audio id="player"></audio>

<script>
const SHOW = {{ show | tojson }};
const EPISODE = {{ episode | tojson }};
const API_BASE = `/api/${SHOW}/${EPISODE}`;

let DATA = null;
let dataLoaded = false;
let statusPollTimer = null;

const STATUS_LABEL = { pending: 'Pending', queued: 'Queued', running: 'Running', done: 'Dubbed', failed: 'Failed', unknown: 'Unknown' };
const STATUS_MESSAGE = {
  pending: 'Not started yet -- go to the show page to hit Start.',
  queued: 'Queued -- waiting for the pipeline to pick it up.',
};

async function loadData() {
  const res = await fetch(`${API_BASE}/data`);
  DATA = await res.json();
  dataLoaded = true;
  document.getElementById('title').textContent = `Dub Review -- ${DATA.episode}`;
  document.getElementById('subtitle').textContent = DATA.show ? `Show: ${DATA.show}` : '';
  document.getElementById('editor').style.display = '';
  document.getElementById('sourceVideo').src = `/audio/${SHOW}/${EPISODE}/source.mp4`;
  document.getElementById('dubVideo').src = `/audio/${SHOW}/${EPISODE}/dubbed.mp4`;
  renderSpeakers();
  renderSegments();
  setupStickyVideoObserver();
}

let stickyObserverStarted = false;

function setupStickyVideoObserver() {
  // Keeps the table header's sticky offset in sync with the actual height of
  // the sticky video block above it (which changes once each <video>'s real
  // aspect ratio loads, and again on window resize) so the two don't overlap.
  if (stickyObserverStarted) return;
  stickyObserverStarted = true;
  const stickyEl = document.getElementById('stickyVideo');
  const updateOffset = () => {
    document.documentElement.style.setProperty('--table-sticky-top', `${stickyEl.offsetHeight}px`);
  };
  new ResizeObserver(updateOffset).observe(stickyEl);
  updateOffset();
}

function formatHMS(seconds) {
  seconds = Math.max(0, Math.round(seconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
}

function seekAndPlay(seg) {
  const sourceVideo = document.getElementById('sourceVideo');
  const dubVideo = document.getElementById('dubVideo');
  sourceVideo.pause();
  dubVideo.pause();
  sourceVideo.currentTime = seg.start;
  dubVideo.currentTime = seg.start;
  const preview = document.querySelector('input[name="previewSource"]:checked').value;
  (preview === 'dub' ? dubVideo : sourceVideo).play();
}

async function refreshStatus() {
  const res = await fetch(`${API_BASE}/status`);
  const status = await res.json();

  const banner = document.getElementById('statusBanner');
  const pill = document.getElementById('statusPill');
  const text = document.getElementById('statusText');
  const errorEl = document.getElementById('statusError');
  const logEl = document.getElementById('logTail');

  const isDone = status.status === 'done';
  banner.style.display = isDone ? 'none' : '';

  if (!isDone) {
    pill.className = `status-pill ${status.status}`;
    pill.textContent = STATUS_LABEL[status.status] || status.status;
    text.textContent = status.status === 'running' && status.stage
      ? `Running: stage ${status.stage}`
      : (STATUS_MESSAGE[status.status] || '');

    if (status.status === 'failed' && status.error) {
      errorEl.style.display = '';
      errorEl.textContent = status.stage ? `${status.error} (at stage ${status.stage})` : status.error;
    } else {
      errorEl.style.display = 'none';
    }

    if (status.status === 'running' || status.status === 'failed') {
      logEl.style.display = '';
      const logRes = await fetch(`${API_BASE}/log`);
      logEl.textContent = await logRes.text();
      logEl.scrollTop = logEl.scrollHeight;
    } else {
      logEl.style.display = 'none';
    }
  }

  if (isDone && !dataLoaded) {
    await loadData();
  }

  if (statusPollTimer) clearTimeout(statusPollTimer);
  if (status.status === 'queued' || status.status === 'running') {
    statusPollTimer = setTimeout(refreshStatus, 3000);
  }
}

function voiceOptionsHtml(selected) {
  const groups = { us_female: 'US Female', us_male: 'US Male', uk_female: 'UK Female', uk_male: 'UK Male' };
  let html = '';
  for (const [key, label] of Object.entries(groups)) {
    html += `<optgroup label="${label}">`;
    for (const v of DATA.voices[key]) {
      html += `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`;
    }
    html += `</optgroup>`;
  }
  return html;
}

function playClip(relPath) {
  const player = document.getElementById('player');
  player.src = `/audio/${SHOW}/${EPISODE}/${relPath}`;
  player.play();
}

function renderSpeakers() {
  const el = document.getElementById('speakers');
  el.innerHTML = '';
  for (const [speaker, info] of Object.entries(DATA.speakers)) {
    const card = document.createElement('div');
    card.className = 'speaker-card';
    const samples = (info.sample_clips || []).map((p, i) =>
      `<button class="sample-btn" onclick="playClip('${p}')">sample ${i + 1}</button>`
    ).join('');
    card.innerHTML = `
      <h3>${speaker}</h3>
      <div class="meta">${info.gender_guess || '?'} guess (median F0 ${info.median_f0_hz ?? '?'} Hz) --
        ${info.segment_count} lines, ${info.total_duration}s</div>
      <div>${samples}</div>
      <select class="voice-select" data-speaker="${speaker}">${voiceOptionsHtml(info.voice)}</select>
    `;
    card.querySelector('.voice-select').addEventListener('change', async (e) => {
      e.target.disabled = true;
      const res = await fetch(`${API_BASE}/speaker/${speaker}/voice`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voice: e.target.value }),
      });
      const result = await res.json();
      DATA.speakers[speaker].voice = e.target.value;
      for (const updated of result.segments) {
        const i = DATA.segments.findIndex(s => s.id === updated.id);
        if (i !== -1) DATA.segments[i] = updated;
      }
      e.target.disabled = false;
      renderSegments();
    });
    el.appendChild(card);
  }
}

function renderSegments() {
  const tbody = document.getElementById('segmentRows');
  const onlyFlagged = document.getElementById('filterFlagged').checked;
  tbody.innerHTML = '';
  for (const seg of DATA.segments) {
    if (onlyFlagged && !seg.needs_review) continue;
    const tr = document.createElement('tr');
    tr.className = seg.needs_review ? 'flagged' : '';
    tr.innerHTML = `
      <td>${seg.id}</td>
      <td class="time"><button class="time-btn" type="button">${formatHMS(seg.start)} - ${formatHMS(seg.end)}</button></td>
      <td class="korean">${seg.korean}</td>
      <td class="english">
        <textarea data-id="${seg.id}">${seg.english ?? ''}</textarea>
        <span class="saved-ok" style="display:none">Saved</span>
      </td>
      <td>
        ${seg.speaker ?? '?'}<br>
        <select class="row-voice" data-id="${seg.id}">${voiceOptionsHtml(seg.voice)}</select>
      </td>
      <td>${seg.audio_path ? `<button class="play-btn" onclick="playClip('${seg.audio_path}')">Play</button>` : ''}</td>
      <td><input type="checkbox" class="flag-check" data-id="${seg.id}" ${seg.needs_review ? 'checked' : ''}></td>
    `;
    tbody.appendChild(tr);

    tr.querySelector('.time-btn').addEventListener('click', () => seekAndPlay(seg));

    const textarea = tr.querySelector('textarea');
    const savedLabel = tr.querySelector('.saved-ok');
    textarea.addEventListener('change', async () => {
      textarea.disabled = true;
      await saveSegment(seg.id, { english: textarea.value });
      textarea.disabled = false;
      savedLabel.style.display = 'inline';
      setTimeout(() => savedLabel.style.display = 'none', 1500);
    });

    tr.querySelector('.row-voice').addEventListener('change', async (e) => {
      e.target.disabled = true;
      await saveSegment(seg.id, { voice: e.target.value });
      e.target.disabled = false;
    });

    tr.querySelector('.flag-check').addEventListener('change', async (e) => {
      await saveSegment(seg.id, { needs_review: e.target.checked });
    });
  }
}

async function saveSegment(id, patch) {
  const res = await fetch(`${API_BASE}/segment/${id}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(patch),
  });
  const updated = await res.json();
  const i = DATA.segments.findIndex(s => s.id === id);
  if (i !== -1) DATA.segments[i] = updated;
  renderSegments();
}

document.getElementById('filterFlagged').addEventListener('change', renderSegments);

document.getElementById('remixBtn').addEventListener('click', async () => {
  const btn = document.getElementById('remixBtn');
  const status = document.getElementById('remixStatus');
  btn.disabled = true;
  status.textContent = 'Mixing...';
  try {
    const res = await fetch(`${API_BASE}/remix`, { method: 'POST' });
    const result = await res.json();
    status.textContent = result.ok ? `Done -- wrote ${result.path}` : 'Failed';
  } catch (e) {
    status.textContent = 'Failed: ' + e;
  }
  btn.disabled = false;
});

refreshStatus();
</script>
</body>
</html>
