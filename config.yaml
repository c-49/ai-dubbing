# Paths, model choices, and mix levels for the dubbing pipeline.
# Tune these as milestones progress; nothing here is final.

paths:
  shows_dir: shows
  work_dir: work

# Allowlist of language pairs a show can be configured with. Adding a new
# source/target language is a config edit here, not a code change -- see
# LANGUAGE_PLAN.md.
languages:
  source:
    ko:
      name: Korean
      whisper_code: ko
    ja:
      name: Japanese
      whisper_code: ja
      # Rapid back-and-forth Japanese dialogue didn't hit the Korean-tuned
      # 500ms silence gap between lines, merging several lines into one
      # Whisper segment (confirmed on a real clip -- splitting at 300ms
      # fixed it with no drop in avg_logprob). See LANGUAGE_PLAN.md M8.
      vad_overrides:
        min_silence_duration_ms: 300
  target:
    en:
      name: English
      words_per_second: 2.3    # empirically tuned against real English TTS/timing (Milestone 2)
      kokoro_lang_code: a
      default_voice: af_bella
      # Confirmed against Kokoro-82M's HF repo file listing (voices/*.pt),
      # not guessed -- see LANGUAGE_PLAN.md M10.
      voice_prefixes: [af, am, bf, bm]
    es:
      name: Spanish
      # UNVALIDATED placeholder (Spanish speech is generally cited as faster
      # than English) -- needs the same empirical tuning English got, against
      # real Spanish TTS output. See LANGUAGE_PLAN.md M10.
      words_per_second: 2.8
      kokoro_lang_code: e    # espeak-ng-backed (misaki.espeak), not a bundled G2P like 'a'/'j'
      default_voice: ef_dora
      # Only 3 voices exist for Spanish today (vs. 20 for English) -- confirmed
      # against Kokoro-82M's HF repo file listing, not guessed.
      voice_prefixes: [ef, em]

models:
  whisper:
    size: large-v3       # used from Milestone 1 onward; downloads ~3GB on first real use
    device: auto         # auto = CUDA if available else CPU; or force cpu / cuda
    compute_type: auto   # auto = float16 on GPU, int8 on CPU
    vad:
      threshold: 0.4            # lower than faster-whisper's 0.5 default, to catch quieter/mumbled lines
      min_silence_duration_ms: 500   # default 2000; shorter so nearby lines don't get merged into one blob
      max_speech_duration_s: 20       # force-split any chunk longer than this
      speech_pad_ms: 200
  demucs:
    model: htdemucs
    device: auto
  pyannote:
    pipeline: pyannote/speaker-diarization-3.1
    device: auto
  ollama:
    model: qwen2.5:7b     # better Korean handling than llama3; pulled during Milestone 0
    host: http://localhost:11434
  tts:
    clone_engine: omnivoice   # engine for speakers set to the "clone" voice (see src/tts_engine.py)
    engine: kokoro    # default_voice is now per-target-language, under languages.target.<code>
    # Registry for src/tts_engine.py. Add `worker: {python: <venv python>}` to
    # run an engine in its own venv as a subprocess (frees VRAM when it exits).
    engines:
      kokoro:
        class: "engines.kokoro_engine:KokoroEngine"
        settings:
          device: auto
      stub:             # test engine: sine tones, for exercising the abstraction
        class: "engines.stub_engine:StubEngine"
      chatterbox:       # voice cloning candidate (M4 bake-off); own venv
        class: "engines.chatterbox_engine:ChatterboxEngine"
        worker:
          python: .venv-engines/chatterbox/Scripts/python.exe
        settings:
          exaggeration: 0.5
          cfg_weight: 0.0     # 0 reduces accent bleed from a foreign-language reference
      omnivoice:        # voice cloning candidate (M4 bake-off); own venv
        class: "engines.omnivoice_engine:OmniVoiceEngine"
        worker:
          python: .venv-engines/omnivoice/Scripts/python.exe
        settings:
          # Listening test (en + es): guidance 1.0 sounded least accented while still
          # like the original speaker; the default 2.0 pulls harder toward the reference's
          # (Korean) accent. Other knobs: speed, num_step, instruct (English accent tags).
          guidance_scale: 1.0
      indextts:         # voice cloning candidate (M4 bake-off); env in third_party/index-tts
        class: "engines.indextts_engine:IndexTTSEngine"
        worker:
          python: third_party/index-tts/.venv/Scripts/python.exe
      stub_worker:      # same stub, run as a subprocess worker (tests that path)
        class: "engines.stub_engine:StubEngine"
        worker:
          python: .venv/Scripts/python.exe

translation:
  chunk_size: 25          # segments per translation request
  context_lines: 3        # lines of surrounding context included

timing:
  max_speedup: 1.25       # cap on speeding up a TTS clip to fit its slot

mix_levels:
  music_effects: 1.0
  original_vocals_ducked: 0.12    # original-language vocals level while a dub line is playing
  original_vocals_unducked: 0.9   # level elsewhere (no dub competing for attention)
  duck_fade_ms: 150               # crossfade length when ducking in/out, to avoid clicks
  english_dub: 1.0
  target_loudness_lufs: -16.0     # final mix normalization target (common for online video)
